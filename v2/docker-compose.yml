version: '3.8'

services:
  # 1. FastAPI Operator Web Dashboard Interface
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_v2_dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # 2. Background Scheduled Mailbox Polling Daemon
  poller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_v2_poller
    volumes:
      - ./data:/app/data
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    # Run in continuous headless scheduled polling mode every 5 minutes
    command: python main.py --schedule 5 --headless
    restart: unless-stopped
